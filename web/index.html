<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blora Agent</title>
    <script>
      (function () {
        var r = document.documentElement,
          t = ["coral", "forest", "ocean", "sunset", "violet", "slate"],
          s = "coral",
          c = "light";
        try {
          var saved = localStorage.getItem("blora-theme");
          if (saved && t.indexOf(saved) !== -1) s = saved;
          var storedScheme = localStorage.getItem("blora-color-scheme");
          if (storedScheme === "dark" || storedScheme === "light") c = storedScheme;
        } catch (e) {}
        r.setAttribute("data-blora-theme", s);
        r.setAttribute("data-blora-color-scheme", c);
        r.style.colorScheme = c;
      })();
    </script>
    <link rel="stylesheet" href="/vendor/blora.css" />
    <link rel="stylesheet" href="/vendor/tokens.dark.css" />
    <link rel="stylesheet" href="/vendor/tokens.themes.css" />
    <link rel="stylesheet" href="/vendor/layout.css" />
    <link rel="stylesheet" href="/vendor/theming.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="blora-page blora-scope">
    <blora-sidebar-layout variant="seamless" sticky label="Blora Agent" toggle-label="打开导航">
      <blora-sidebar-layout-sidebar>
        <header class="ba-brand">
          <span class="blora-avatar" data-size="md" data-variant="primary">BA</span>
          <div>
            <strong class="ba-brand__name">Blora Agent</strong>
            <p class="ba-brand__meta">本地 Code / Work / Agent</p>
          </div>
        </header>
        <button type="button" class="blora-button" data-variant="primary" data-icon="plus" id="new-session">
          新建会话
        </button>
        <blora-sidebar-nav id="session-nav" label="会话">
          <blora-sidebar-nav-group id="session-list" label="会话"></blora-sidebar-nav-group>
        </blora-sidebar-nav>
        <blora-empty id="session-empty" title="暂无会话" description="创建会话后会出现在这里。"></blora-empty>
        <section class="ba-section" aria-labelledby="approvals-heading">
          <h2 id="approvals-heading" class="ba-section__title">待审批</h2>
          <div id="approval-list" class="blora-list"></div>
          <blora-empty id="approval-empty" title="没有待审批" description="写入和命令会在这里请求确认。"></blora-empty>
        </section>
        <section class="ba-section" aria-labelledby="tasks-heading">
          <h2 id="tasks-heading" class="ba-section__title">后台任务</h2>
          <div id="task-list" class="blora-list"></div>
          <blora-empty id="task-empty" title="没有后台任务" description="用下方表单排队一个任务。"></blora-empty>
        </section>
      </blora-sidebar-layout-sidebar>
      <blora-sidebar-layout-content>
        <main class="ba-main">
          <header class="ba-toolbar">
            <div>
              <h1 id="session-title">选择一个会话</h1>
              <p class="ba-toolbar__path" id="session-path"></p>
            </div>
            <div class="ba-toolbar__actions">
              <blora-switch id="auto-approve" name="auto_approve" value="on">自动批准写入/命令</blora-switch>
              <button type="button" class="blora-button" data-variant="ghost" data-icon="minimize-2" id="compact">
                压缩上下文
              </button>
            </div>
          </header>
          <blora-alert id="page-alert" variant="danger" hidden></blora-alert>
          <div id="subagents" class="ba-tags" hidden></div>
          <section class="ba-thread" id="thread" aria-live="polite">
            <blora-empty
              id="thread-empty"
              title="还没有消息"
              description="从左侧打开会话，或直接在下方发送第一条。"
            ></blora-empty>
          </section>
          <form class="ba-task-form" id="task-form">
            <blora-field label="排队后台任务" name="title" required>
              <input class="blora-input" id="task-title" maxlength="80" />
            </blora-field>
            <blora-number-input id="task-delay" name="delay" label="延迟秒数" min="0" value="0"></blora-number-input>
            <button type="submit" class="blora-button" data-variant="secondary">排队</button>
          </form>
          <form class="ba-composer" id="composer">
            <blora-field label="向 Blora 发送" name="prompt" required>
              <textarea
                class="blora-textarea"
                id="prompt"
                rows="3"
                placeholder="描述你想在工作区完成的事"
              ></textarea>
            </blora-field>
            <button type="submit" class="blora-button" data-variant="primary" data-icon="send" id="send">发送</button>
          </form>
        </main>
      </blora-sidebar-layout-content>
    </blora-sidebar-layout>
    <script src="/vendor/blora.global.js"></script>
    <script src="/vendor/layout.global.js"></script>
    <script src="/vendor/theming.global.js"></script>
    <script src="/app.js"></script>
  </body>
</html>

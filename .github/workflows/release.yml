name: Release Blora Agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: blora
          - name: macos-x86_64
            os: macos-14
            # macos-14 is arm64; Rust/Apple clang cross-build this x86_64 target.
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: blora
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: blora
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: blora.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p blora-cli
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/blora
          tar -czf "blora-${version}-${{ matrix.name }}.tar.gz" -C package blora
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "package/${{ matrix.binary }}"
          Compress-Archive -Path "package/${{ matrix.binary }}" -DestinationPath "blora-$version-${{ matrix.name }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: blora-${{ matrix.name }}
          path: blora-*.*

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: blora-*
          merge-multiple: true
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Blora Agent $GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes

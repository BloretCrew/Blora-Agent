[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blora-agent-sdk"
version = "0.1.0b3"
description = "Python SDK for the Blora Agent stdio protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Blora Agent contributors" }]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/BloretCrew/Blora-Agent"

[tool.hatch.build.targets.wheel]
packages = ["blora_agent"]
artifacts = ["blora_agent/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

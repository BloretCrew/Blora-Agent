name: Blora Agent
description: 在 GitHub Actions 里运行 Blora Agent，由评论决定回复、改代码或打开 Pull Request
branding:
  icon: cpu
  color: blue

inputs:
  provider:
    description: 供应商名称。留空则沿用 BLORA_PROVIDER。
    required: false
    default: ""
  model:
    description: 模型名称。留空则沿用 BLORA_MODEL。
    required: false
    default: ""
  permission:
    description: plan、ask、auto-edit 或 yolo
    required: false
    default: yolo
  mentions:
    description: 逗号分隔的触发词，大小写不敏感
    required: false
    default: /blora,/ba,@blora
  prompt:
    description: 覆盖评论正文。schedule、workflow_dispatch 和 issues 事件必填。
    required: false
    default: ""
  max_turns:
    description: 单次任务的 turn 上限
    required: false
    default: "24"
  wall_seconds:
    description: 墙钟上限，写入 BLORA_MAX_WALL_SECS
    required: false
    default: "1500"

runs:
  using: composite
  steps:
    - name: Install Blora
      shell: bash
      run: |
        set -euo pipefail
        if command -v blora >/dev/null 2>&1; then
          echo "使用 PATH 中的 blora: $(command -v blora)"
          exit 0
        fi
        os="$(uname -s)"
        arch="$(uname -m)"
        case "${os}-${arch}" in
          Linux-x86_64) target=x86_64-unknown-linux-gnu ;;
          Linux-aarch64|Linux-arm64) target=aarch64-unknown-linux-gnu ;;
          Darwin-x86_64) target=x86_64-apple-darwin ;;
          Darwin-arm64) target=aarch64-apple-darwin ;;
          *)
            echo "没有找到 blora，也不能在 ${os}-${arch} 上自动下载。" >&2
            echo "请先发布 release，或在上一步把 blora 加入 PATH。" >&2
            exit 1
            ;;
        esac
        asset="blora-${target}"
        url="https://github.com/bloret-crew/blora-agent/releases/latest/download/${asset}"
        dest="${HOME}/.blora/bin"
        mkdir -p "${dest}"
        echo "下载 ${url}"
        if ! curl -fsSL "${url}" -o "${dest}/blora"; then
          echo "下载失败。请发布名为 ${asset} 的 Release 资产，或在上一步把 blora 加入 PATH。" >&2
          exit 1
        fi
        chmod +x "${dest}/blora"
        echo "${dest}" >> "${GITHUB_PATH}"

    - name: Run Blora Agent
      shell: bash
      env:
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        BLORA_GITHUB_PERMISSION: ${{ inputs.permission }}
        MENTIONS: ${{ inputs.mentions }}
        PROMPT: ${{ inputs.prompt }}
        BLORA_GITHUB_MAX_TURNS: ${{ inputs.max_turns }}
        BLORA_MAX_WALL_SECS: ${{ inputs.wall_seconds }}
      run: |
        set -euo pipefail
        token="${BLORA_GITHUB_TOKEN:-${GITHUB_TOKEN:-}}"
        if [ -z "${GH_TOKEN:-}" ] && [ -n "${token}" ]; then
          export GH_TOKEN="${token}"
        fi
        if [ -n "${token}" ]; then
          dir="${RUNNER_TEMP:-/tmp}"
          umask 077
          printf '%s' "${token}" > "${dir}/blora-git-token"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *sername*) printf "%s\n" x-access-token ;;' \
            '  *) cat "${BLORA_GIT_TOKEN_FILE:?}" ;;' \
            'esac' > "${dir}/blora-git-askpass.sh"
          chmod 700 "${dir}/blora-git-askpass.sh"
          export BLORA_GIT_TOKEN_FILE="${dir}/blora-git-token"
          export GIT_ASKPASS="${dir}/blora-git-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
        fi
        if [ -n "${INPUT_PROVIDER}" ]; then
          export BLORA_PROVIDER="${INPUT_PROVIDER}"
        fi
        if [ -n "${INPUT_MODEL}" ]; then
          export BLORA_MODEL="${INPUT_MODEL}"
        fi
        blora github run
